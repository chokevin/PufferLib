[base]
env_name = craftax_clean

[vec]
total_agents = 16384
num_buffers = 16
num_threads = 16

[env]
reset_pool_size = 32
action_mask = 1

[train]
total_timesteps = 1_357_640_700
learning_rate = 0.0291086566
ent_coef = 0.000480757182
gamma = 0.995080769
gae_lambda = 0.968039155
horizon = 128
minibatch_size = 65536
